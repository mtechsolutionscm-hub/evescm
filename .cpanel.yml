---
# Static Vite deployment: GitHub Actions builds dist; cPanel only publishes it.
deployment:
  tasks:
    - export DEPLOYPATH=/home/evesqies/public_html/
    - /bin/test -f dist/index.html
    # Remove stale files from previous deployments so deleted gallery assets cannot remain public.
    - /usr/bin/find $DEPLOYPATH -mindepth 1 -maxdepth 1 -exec /bin/rm -rf -- {} +
    - /bin/cp -R dist/. $DEPLOYPATH
    - /bin/test -f $DEPLOYPATH/index.html
