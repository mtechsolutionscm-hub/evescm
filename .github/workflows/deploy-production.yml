name: EVES production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://mozwkfyiaqxwaoxwpkry.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UhbESgvWxdswVun3Vo5uvw_xk0SvpPF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify EVES Supabase database
        run: |
          set -e
          for table in eves_cms_config eves_cms_pages eves_cms_news eves_cms_media eves_cms_sections eves_cms_navigation; do
            curl -fsS \
              "$VITE_SUPABASE_URL/rest/v1/$table?select=*&limit=1" \
              -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" >/dev/null
            echo "OK: $table"
          done

      - name: Build Vite production bundle
        run: npm run build

      - name: Verify bundle
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -f dist/gallery/image-1.jpeg
          test -f dist/gallery/image-2.jpeg
          test -f dist/gallery/image-3.jpeg
          echo "EVES production bundle ready"
          du -sh dist

      - name: Publish generated dist to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "No dist changes."
            exit 0
          fi
          git commit -m "build: publish EVES production bundle [skip ci]"
          git push
