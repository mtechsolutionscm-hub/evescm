name: EVES production pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_PROJECT_ID: prj_pwbbob8Tp3FgRfnSCAx0iIhDDCsM
  VERCEL_ORG_ID: team_bN50nXRjcFRDYboc1sUnzxYB

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify production bundle
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "Production bundle:"
          du -sh dist
          find dist/assets -maxdepth 1 -type f | head -20

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured; Vercel Git integration remains the production deploy path."
            exit 0
          fi
          npx vercel@latest link --yes --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Namecheap routing check
        run: |
          echo "Namecheap is the domain/DNS layer."
          echo "The production domain should resolve to Vercel so CMS, AI, auth and newsletter serverless APIs remain available."
