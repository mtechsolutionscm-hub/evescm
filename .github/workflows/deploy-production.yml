name: EVES production pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify production bundle
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "Production bundle:"
          du -sh dist
          find dist/assets -maxdepth 1 -type f | head -20

      - name: Deploy to Vercel production
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}"
          npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}"
          npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}"

      - name: Verify Vercel deployment configuration
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "VERCEL_TOKEN is not configured."
          echo "Vercel Git integration can still deploy main automatically."
          echo "Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to let GitHub Actions own the production deployment."

      - name: Namecheap routing note
        run: |
          echo "Namecheap remains the domain/DNS layer."
          echo "Point the production domain to Vercel; do not FTP dist because EVES uses Vercel serverless APIs for CMS, AI, auth and newsletter."
