name: EVES production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite production bundle
        run: npm run build

      - name: Verify bundle
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -f dist/gallery/image-1.jpeg
          test -f dist/gallery/image-2.jpeg
          test -f dist/gallery/image-3.jpeg
          echo "EVES production bundle ready"
          du -sh dist

      - name: Publish generated dist to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "No dist changes."
            exit 0
          fi
          git commit -m "build: publish EVES production bundle [skip ci]"
          git push
