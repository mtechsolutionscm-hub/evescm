name: EVES production build & Namecheap FTPS deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://mozwkfyiaqxwaoxwpkry.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UhbESgvWxdswVun3Vo5uvw_xk0SvpPF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify EVES Supabase database
        run: |
          set -e
          for table in eves_cms_config eves_cms_pages eves_cms_news eves_cms_media eves_cms_sections eves_cms_navigation; do
            curl -fsS "$VITE_SUPABASE_URL/rest/v1/$table?select=*&limit=1"               -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY"               -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" >/dev/null
            echo "OK: $table"
          done

      - name: Prepare gallery assets outside the /gallery route
        run: |
          set -e
          mkdir -p public/media/gallery
          for f in public/gallery/image-*.jpeg; do
            [ -f "$f" ] && mv "$f" public/media/gallery/
          done
          rm -f public/gallery/index.html
          rmdir public/gallery 2>/dev/null || true
          test -f public/media/gallery/image-1.jpeg
          test -f public/media/gallery/image-2.jpeg
          test -f public/media/gallery/image-3.jpeg

      - name: Build Vite production bundle
        run: npm run build

      - name: Verify production bundle
        run: |
          set -e
          test -s dist/index.html
          test -d dist/assets
          test -f dist/media/gallery/image-1.jpeg
          test -f dist/media/gallery/image-2.jpeg
          test -f dist/media/gallery/image-3.jpeg
          test -f dist/.htaccess
          echo "EVES production bundle ready"
          du -sh dist

      - name: Deploy directly to Namecheap via explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.evescm.org
          username: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          password: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: true
          security: loose
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Publish generated dist to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "No dist changes."
            exit 0
          fi
          git commit -m "build: publish EVES production bundle [skip ci]"
          git push

      - name: Deployment summary
        run: |
          echo "EVES deployed directly to Namecheap over explicit FTPS."
          echo "FTP host: ftp.evescm.org"
          echo "FTP port: 21"
          echo "Remote root: public_html"
